<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brugge 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Planner voor het vriendenweekend in Beernem en Brugge, 13 tot 15 november.">
<meta name="theme-color" content="#6E1423" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F171A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brugge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icoon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icoon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EE; --surface:#FFFFFF; --surface-2:#F3ECDF; --line:#E7DDCB;
  --ink:#1E2A2F; --ink-2:#5D6B70; --ink-3:#8C989C;
  --kriek:#6E1423; --kriek-tekst:#7E1A2C; --kriek-diep:#5A0F1C; --on-kriek:#FFF4E6;
  --tripel:#C9973B; --tripel-zacht:#F5E6C4; --tripel-tekst:#7A5512;
  --reien:#2F5D50; --reien-zacht:#DCEBE3;
  --rood:#B3261E; --rood-zacht:#F8E1DE; --balk-huis:#4A0F19;
  --schaduw:0 1px 2px rgba(30,42,47,.05),0 10px 30px -12px rgba(30,42,47,.18);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F171A; --surface:#162025; --surface-2:#1D292F; --line:#28363D;
    --ink:#EFE7DA; --ink-2:#A2AFB3; --ink-3:#73828A;
    --kriek:#B23A4E; --kriek-tekst:#E58A98; --kriek-diep:#3D0B15; --on-kriek:#FFF1E3;
    --tripel:#D9AE5B; --tripel-zacht:#3A2F1B; --tripel-tekst:#E8C27A;
    --reien:#76BCA3; --reien-zacht:#1C3A31;
    --rood:#F08A80; --rood-zacht:#3D1E1C; --balk-huis:#8E5560;
    --schaduw:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#162025; --surface-2:#1D292F; --line:#28363D;
  --ink:#EFE7DA; --ink-2:#A2AFB3; --ink-3:#73828A;
  --kriek:#B23A4E; --kriek-tekst:#E58A98; --kriek-diep:#3D0B15; --on-kriek:#FFF1E3;
  --tripel:#D9AE5B; --tripel-zacht:#3A2F1B; --tripel-tekst:#E8C27A;
  --reien:#76BCA3; --reien-zacht:#1C3A31;
  --rood:#F08A80; --rood-zacht:#3D1E1C; --balk-huis:#8E5560;
  --schaduw:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--kriek-tekst)}
:focus-visible{outline:2px solid var(--tripel);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- App-balk ---------- */
.appbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.appbar.rand{border-bottom-color:var(--line)}
.appbar-in{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.appbar h1{font:600 22px/1 var(--serif);letter-spacing:-.01em;margin:0;flex:1;display:flex;align-items:baseline;gap:8px}
.appbar h1 small{font:500 13px/1 var(--sans);color:var(--ink-3)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--reien);flex:none;transition:background .3s}
.sync.bezig{background:var(--tripel);animation:puls 1s ease-in-out infinite}
.sync.fout{background:var(--rood)}
@keyframes puls{50%{opacity:.35}}
.rond{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink-2);padding:0}
.rond svg{width:18px;height:18px}
.avatar{font:700 14px/1 var(--sans);color:var(--on-kriek);background:var(--kriek);border-color:transparent}

/* ---------- Views ---------- */
main{max-width:720px;margin:0 auto;padding:4px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px)}
.view[hidden]{display:none}
.view{animation:inkomen .22s ease-out}
@keyframes inkomen{from{opacity:0;transform:translateY(6px)}}
h2.kop{font:600 28px/1.1 var(--serif);letter-spacing:-.015em;margin:22px 0 12px}
h3.subkop{font:600 20px/1.2 var(--serif);margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
h3.subkop span{font:500 14px/1 var(--sans);color:var(--ink-3)}
.mut{color:var(--ink-2)}
.klein{font-size:13px}

/* ---------- Tabbalk ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11.5px;font-weight:600;position:relative}
.tabbar svg{width:24px;height:24px;transition:transform .2s}
.tabbar button[aria-current="page"]{color:var(--kriek-tekst)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--kriek);color:var(--on-kriek);font-size:11px;font-weight:700;display:grid;place-items:center}
.tabbar .badge:empty{display:none}

/* ---------- Segmenten ---------- */
.segment{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.segment button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:600;font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.segment button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.segment .tel{font-size:12px;color:var(--ink-3);font-weight:600}
.plak{position:sticky;top:calc(env(safe-area-inset-top) + 59px);z-index:20;background:var(--bg);padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px}

/* ---------- Draaiboek: held ---------- */
.held{position:relative;margin-top:10px;border-radius:28px;background:var(--kriek-diep);color:var(--on-kriek);overflow:hidden;padding:24px 22px 92px;isolation:isolate}
.held::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% -10%,rgba(201,151,59,.35),transparent 60%);z-index:-1}
.held .wanneer{font-size:14px;color:color-mix(in srgb,var(--on-kriek) 72%,transparent);margin:0 0 6px}
.held .teller{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.held .groot{font:600 clamp(72px,24vw,112px)/.86 var(--serif);font-variation-settings:"opsz" 144;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.held .eenheid{font:500 20px/1.15 var(--serif);padding-bottom:8px}
.held .eenheid b{display:block;font-weight:600}
.held .gevels{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:76px;color:var(--bg)}
.held .gevels path{fill:currentColor}

.weer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.weer-dag{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center}
.weer-dag b{display:block;font-size:13px;font-weight:600;color:var(--ink-2)}
.weer-dag .ic{font-size:26px;line-height:1.3;display:block}
.weer-dag .t{display:block;font:600 19px/1.2 var(--serif);font-variant-numeric:tabular-nums;margin-top:2px}
.weer-dag .t small{font:500 13px var(--sans);color:var(--ink-3)}
.weer-dag .r{display:block;font-size:12px;line-height:1.3;color:var(--ink-3);margin-top:3px}
.weer-dag.leeg .ic{opacity:.35}

.mini-budget{display:flex;align-items:center;gap:14px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;width:100%;text-align:left}
.mini-budget .cijfer{font:600 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.mini-budget .cijfer.over{color:var(--rood)}
.mini-budget .balk{flex:1}
.mini-budget svg{width:18px;height:18px;color:var(--ink-3)}

/* ---------- Draaiboek: lijnkaart ---------- */
.route{list-style:none;margin:14px 0 0;padding:0;position:relative}
.halte{display:grid;grid-template-columns:62px 28px 1fr;align-items:start;position:relative;min-height:58px}
.halte .uur{font:600 17px/1.25 var(--serif);font-variant-numeric:tabular-nums;text-align:right;padding-top:12px;color:var(--ink)}
.halte .uur.zacht{font:500 13px/1.3 var(--sans);color:var(--ink-3);padding-top:15px}
.halte .spoor{position:relative;height:100%}
.halte .spoor::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:4px;background:var(--kriek);border-radius:2px}
.halte:first-child .spoor::before{top:18px}
.halte:last-child .spoor::before{bottom:calc(100% - 22px)}
.halte .stip{position:absolute;left:6px;top:13px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--kriek);z-index:1}
.halte.overstap .stip{width:22px;height:22px;left:4px;top:11px;border-color:var(--tripel);background:var(--tripel)}
.halte.open .stip{border-style:dashed;border-color:var(--ink-3);background:var(--bg)}
.halte.open .spoor::before{background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 10px)}
.halte.nu .stip{box-shadow:0 0 0 6px color-mix(in srgb,var(--tripel) 35%,transparent)}
.halte .wat{padding:10px 0 14px 8px;min-width:0}
.halte .wat b{display:block;font-weight:600;line-height:1.3}
.halte .wat span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.halte.open .wat b{color:var(--ink-3);font-weight:500}
.halte .wat button{all:unset;cursor:pointer;color:var(--kriek-tekst);font-weight:600;font-size:14px}
.dagkop{font:600 13px/1 var(--sans);color:var(--ink-3);margin:18px 0 0 90px}

/* ---------- Plannen ---------- */
.deel{margin-top:22px}
.deel-kop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.deel-kop h3{font:600 22px/1.15 var(--serif);margin:0}
.deel-kop p{margin:0;color:var(--ink-3);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.ok{background:var(--reien-zacht);color:var(--reien)}
.chip.open{background:var(--tripel-zacht);color:var(--tripel-tekst)}
.chip.zacht{background:var(--surface-2);color:var(--ink-2);font-weight:600}

.keuze{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--schaduw);padding:14px 14px 12px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.keuze::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--kriek)}
.keuze-top{display:flex;gap:12px;align-items:flex-start}
.keuze h4{margin:0;font-size:16.5px;line-height:1.3;font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}
.keuze .oms{margin:6px 0 0;color:var(--ink-2);font-size:14px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.keuze .voet{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.tijd{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--kriek-tekst);font-variant-numeric:tabular-nums}
.tijd svg{width:14px;height:14px}
.prijs{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.prijs small{font-weight:500;color:var(--ink-3)}
.label-geschat{font-size:12px;color:var(--tripel-tekst);font-weight:600}
.knopje{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.knopje svg{width:16px;height:16px}
.knopje.link{text-decoration:none}
.voet .rechts{margin-left:auto;display:flex;gap:6px}

.vink-rond{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent;transition:background .15s,border-color .15s,transform .1s}
.vink-rond svg{width:18px;height:18px}
.vink-rond[aria-pressed="true"]{background:var(--kriek);border-color:var(--kriek);color:var(--on-kriek)}
.vink-rond:active{transform:scale(.92)}

.meer{width:100%;border:0;background:none;display:flex;align-items:center;gap:8px;padding:10px 2px;color:var(--ink-2);font-weight:600;font-size:14px}
.meer svg{width:16px;height:16px;transition:transform .2s}
.meer[aria-expanded="true"] svg{transform:rotate(180deg)}
.opties{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.optie{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.optie:first-child{border-top:0}
.optie .tekst{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.optie .tekst b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.optie .tekst span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.toevoeg-knop{width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:11px;color:var(--kriek-tekst);font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px}
.toevoeg-knop svg{width:18px;height:18px}

/* ---------- Lijsten ---------- */
.voortgang{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.voortgang .balk{flex:1}
.voortgang b{font-variant-numeric:tabular-nums}
.invoer{display:flex;gap:8px;margin:12px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--schaduw)}
.invoer input,.invoer select{border:0;background:none;min-width:0;padding:8px 8px;outline:none}
.invoer input:first-child{flex:2}
.invoer .hv{flex:1;border-left:1px solid var(--line)}
.invoer select{flex:1.2;border-left:1px solid var(--line);color:var(--ink-2);max-width:150px}
.invoer button{flex:none;border:0;border-radius:11px;background:var(--kriek);color:var(--on-kriek);width:42px;display:grid;place-items:center;padding:0}
.invoer button svg{width:20px;height:20px}
.invoer:focus-within{border-color:var(--tripel)}
@media (max-width:480px){
  .invoer{flex-wrap:wrap;gap:0}
  .invoer input:first-child{flex:1 1 100%;border-bottom:1px solid var(--line);padding:10px 8px}
  .invoer .hv{border-left:0}
  .invoer button{margin:4px 0 0 4px;height:40px}
  .invoer select{max-width:none}
}
.schakelaar-rij{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;color:var(--ink-2);margin:6px 2px 0}
.groep{margin-top:18px}
.groep h4{margin:0 0 8px;display:flex;align-items:baseline;gap:8px;font:600 17px/1.2 var(--serif)}
.groep h4 span{font:500 13px var(--sans);color:var(--ink-3)}
.rijen{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rij{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.rij:first-child{border-top:0}
.vak{appearance:none;width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface);margin:0;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.vak::after{content:"";width:6px;height:12px;border:solid var(--on-kriek);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s}
.vak:checked{background:var(--reien);border-color:var(--reien)}
.vak:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1);border-color:var(--bg)}
.rij .tekst{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.rij .tekst b{font-weight:550}
.rij .tekst .hv{color:var(--ink-3)}
.rij .tekst small{display:block;font-size:12.5px;color:var(--ink-3)}
.rij.klaar .tekst b{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.rij .bedrag{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--ink-2)}

/* ---------- Kosten ---------- */
.budget-kaart{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--schaduw);margin-top:10px}
.budget-kaart .rest{font:600 44px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.budget-kaart .rest.over{color:var(--rood)}
.budget-kaart .rest.krap{color:var(--tripel-tekst)}
.balk{height:10px;border-radius:5px;background:var(--surface-2);display:flex;overflow:hidden}
.balk span{height:100%;transition:width .4s ease}
.balk .b1{background:var(--balk-huis)}
.balk .b2{background:var(--tripel)}
.balk .b3{background:var(--kriek)}
.balk .bok{background:var(--reien)}
.budget-kaart .balk{margin:14px 0 12px}
.legenda{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;font-size:14px;align-items:center}
.legenda i{width:10px;height:10px;border-radius:3px;display:block}
.legenda .num{text-align:right;font-weight:600}
.legenda .streep{grid-column:1/-1;height:1px;background:var(--line);margin:2px 0}
.legenda .totaal{font-weight:700}

.paneel{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.post{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.post .tekst{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.post .tekst b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.post .tekst span{display:block;font-size:13px;color:var(--ink-3)}
.post.uit .tekst b,.post.uit .num{color:var(--ink-3)}
.post .num{font-weight:650;white-space:nowrap}
.post svg{width:16px;height:16px;flex:none;color:var(--ink-3)}
.gekoppeld{color:var(--reien)!important;font-weight:600}
.schakel{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.schakel::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.schakel:checked{background:var(--kriek)}
.schakel:checked::after{transform:translateX(18px)}

.saldo{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.saldo:first-child{border-top:0}
.saldo b{font-weight:600}
.saldo .num{font-weight:700}
.saldo .plus{color:var(--reien)}
.saldo .min{color:var(--rood)}
.saldo small{grid-column:1/-1;color:var(--ink-3);font-size:12.5px}
.verreken{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.verreken:first-child{border-top:0}
.verreken svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.verreken .num{margin-left:auto;font-weight:700}

.melding-blok{border-radius:16px;padding:14px 16px;background:var(--tripel-zacht);color:var(--tripel-tekst);font-size:14px;margin-top:12px}
.melding-blok.fout{background:var(--rood-zacht);color:var(--rood)}
.leeg{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:14px}

/* ---------- Sheets ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.25);overflow:auto;overscroll-behavior:contain}
dialog.sheet[open]{animation:omhoog .26s cubic-bezier(.2,.8,.2,1)}
@keyframes omhoog{from{transform:translateY(40px);opacity:.4}}
dialog.sheet::backdrop{background:rgba(10,14,16,.45);backdrop-filter:blur(2px)}
@media (min-width:640px){dialog.sheet{margin:auto;border-radius:24px}}
.greep{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sheet-kop{display:flex;align-items:center;gap:10px;padding:10px 20px 4px}
.sheet-kop h3{margin:0;flex:1;font:600 24px/1.15 var(--serif)}
.sheet-kop p{margin:2px 0 0;font-size:14px;color:var(--ink-3)}
form.velden{padding:10px 20px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px}
.veld label,.veld .lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.veld input,.veld textarea,.veld select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);min-height:46px}
.veld textarea{min-height:84px;resize:vertical}
.veld input:focus,.veld textarea:focus,.veld select:focus{outline:none;border-color:var(--tripel);box-shadow:0 0 0 3px color-mix(in srgb,var(--tripel) 25%,transparent)}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kiezer{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.kiezer label{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2);margin:0}
.kiezer input{position:absolute;opacity:0;pointer-events:none}
.kiezer label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kiezer label:has(input:focus-visible){outline:2px solid var(--tripel)}
.chips-kies{display:flex;flex-wrap:wrap;gap:6px}
.chips-kies label{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-2);margin:0}
.chips-kies input{position:absolute;opacity:0;pointer-events:none}
.chips-kies label:has(input:checked){background:var(--kriek);border-color:var(--kriek);color:var(--on-kriek)}
.hint{font-size:13px;color:var(--ink-3);margin:-6px 0 0}
.fout{color:var(--rood);font-size:14px;font-weight:600;min-height:0;margin:0}
.fout:empty{display:none}
.sheet-acties{display:flex;gap:10px;align-items:center}
.sheet-acties .weg{margin-right:auto;color:var(--rood);border-color:transparent;background:none;padding-left:0}
.knop{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 18px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.knop.hoofd{background:var(--kriek);border-color:var(--kriek);color:var(--on-kriek)}
.knop.breed{width:100%}
.knop[disabled]{opacity:.55;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;transition:all .22s;pointer-events:none;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.toon{opacity:1;transform:translate(-50%,0)}
.toast.fout{background:var(--rood);color:#fff}

@media (min-width:720px){
  h2.kop{font-size:34px}
  .held{padding:30px 30px 100px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function saldi() {
  const ids = S.deelnemers.map(d => d.id), s = Object.fromEntries(ids.map(i => [i, { betaald: 0, deel: 0 }]));
  S.uitgaven.forEach(u => {

    if (s[u.betaald_door]) s[u.betaald_door].betaald += Number(u.bedrag);
